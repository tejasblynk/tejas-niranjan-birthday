<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Admin • Tejas Niranjan</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#070912;color:#f8fafc;font:14px 'DM Sans';}.wrap{width:min(1200px,calc(100% - 28px));margin:auto;padding:30px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.title{font:700 38px 'Space Grotesk';letter-spacing:-.05em}.muted{color:#94a3b8}.btn{padding:11px 15px;border:1px solid #334155;background:#111827;color:white;border-radius:12px;cursor:pointer}.danger{border-color:#7f1d1d}.card{background:#111827cc;border:1px solid #253047;border-radius:20px;padding:20px}.login{max-width:420px;margin:80px auto}.input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#fff}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;margin-top:16px}#map{height:650px;border-radius:16px;overflow:hidden}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #253047}.online{color:#34d399}.offline{color:#94a3b8}@media(max-width:850px){.grid{grid-template-columns:1fr}#map{height:450px}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">Birthday Control Center</div><div class="muted">Consent-based live guest location & RSVP dashboard</div></div><button id="logout" class="btn" style="display:none">Sign out</button></div><div id="login" class="card login"><h2>Admin sign-in</h2><input id="email" class="input" type="email" placeholder="Admin email"><input id="password" class="input" type="password" placeholder="Password"><button id="loginBtn" class="btn">Sign in</button><p id="msg" class="muted"></p></div><div id="dash" style="display:none"><div class="grid"><div class="card"><h3>Guests</h3><div id="stats" class="muted">Loading…</div><div id="users"></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Live map</h3><span class="muted">Updates in real time</span></div><div id="map"></div></div></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
const CONFIG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",projectId:"YOUR_PROJECT",storageBucket:"YOUR_PROJECT.firebasestorage.app",messagingSenderId:"YOUR_SENDER_ID",appId:"YOUR_APP_ID"};
const enabled=!Object.values(CONFIG).some(v=>String(v).includes('YOUR_'));
const login=document.getElementById('login'),dash=document.getElementById('dash'),msg=document.getElementById('msg');let auth,db,fb={};
if(!enabled){msg.textContent='Add the same Firebase config used by index.html before deployment.'}
if(enabled){const {initializeApp}=await import('https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js');const a=initializeApp(CONFIG);const x=await import('https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js');const r=await import('https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js');auth=x.getAuth(a);db=r.getDatabase(a);fb={...x,...r};auth.onAuthStateChanged(u=>{if(u){login.style.display='none';dash.style.display='block';document.getElementById('logout').style.display='block';start();}else{login.style.display='block';dash.style.display='none';}})}
document.getElementById('loginBtn').onclick=async()=>{try{await fb.signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value)}catch(e){msg.textContent=e.message}};document.getElementById('logout').onclick=()=>fb.signOut(auth);
let map,markers={};function start(){map=L.map('map').setView([25.455835022731513,78.63566455483142],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);L.marker([25.455835022731513,78.63566455483142]).addTo(map).bindPopup('Venue').openPopup();const q=fb.query(fb.ref(db,'users'));fb.onValue(q,s=>{const data=s.val()||{};document.getElementById('stats').textContent=`${Object.keys(data).length} location records • sharing status shown below`;const list=document.getElementById('users');list.innerHTML='';Object.entries(data).forEach(([id,u])=>{const online=u.sharing&&u.lastSeen;const row=document.createElement('div');row.className='row';row.innerHTML=`<div><b>${escapeHtml(u.name||'Guest')}</b><br><span class="${online?'online':'offline'}">● ${online?'Sharing location':'Not sharing'}</span></div><div class="muted">${u.lat?.toFixed?.(5)??''}, ${u.lon?.toFixed?.(5)??''}</div>`;list.appendChild(row);if(u.lat&&u.lon){if(!markers[id])markers[id]=L.marker([u.lat,u.lon]).addTo(map);else markers[id].setLatLng([u.lat,u.lon]);markers[id].bindPopup(`<b>${escapeHtml(u.name||'Guest')}</b><br>${u.lat.toFixed(5)}, ${u.lon.toFixed(5)}`)}})})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
